name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    # The e2e suite needs a logged-in VP Online account, so CI runs the offline checks only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check server.js && node --check lib/browser.js && node --check lib/vp.js && node --check lib/page-api.js
      - run: npm run check
      - name: Package contents
        run: npm pack --dry-run
